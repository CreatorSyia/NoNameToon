<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작품 상세 - 노넴툰</title>
    <style>
        :root { --bg-color: #f8f9fa; --text-color: #212529; --header-bg: #ffffff; --card-bg: #ffffff; --border-color: #dee2e6; --accent-color: #6366f1; --accent-hover: #4f46e5; }
        [data-theme="dark"] { --bg-color: #121212; --text-color: #e0e0e0; --header-bg: #1e1e1e; --card-bg: #2d2d2d; --border-color: #404040; --accent-color: #818cf8; --accent-hover: #6366f1; }
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        header { background-color: var(--header-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent-color); }
        .detail-container { max-width: 900px; margin: 3rem auto; padding: 0 2rem; }
        
        .webtoon-header { display: flex; gap: 2rem; background-color: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 3rem; flex-wrap: wrap; }
        .thumbnail { width: 220px; height: 300px; border-radius: 8px; object-fit: cover; background-color: #ddd; flex-shrink: 0; }
        .info-box { flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-start; }
        
        /* 배지 컨테이너 및 장르 배지 */
        .badges { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
        .genre-badge { padding: 0.3rem 0.8rem; background-color: var(--accent-color); color: white; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        
        /* 연재 상태 배지 스타일 설정 */
        .status-badge { padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-weight: bold; color: white; }
        .status-ongoing { background-color: #ef4444; } /* 연재중 (빨강) */
        .status-hiatus { background-color: #6b7280; } /* 휴재중 (회색) */
        .status-season-end { background-color: #3b82f6; } /* 시즌완결 (파랑) */
        .status-completed { background-color: #ffffff; color: #1f2937; border: 1px solid #d1d5db; } /* 완결 (하양) */
        [data-theme="dark"] .status-completed { background-color: #1f2937; color: #f3f4f6; border: 1px solid #4b5563; }

        .title { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
        .author { font-size: 1.1rem; opacity: 0.8; margin-bottom: 1rem; }
        
        .stats-box { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; font-size: 0.95rem; font-weight: bold; opacity: 0.9; flex-wrap: wrap; }
        .action-btn { background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
        .action-btn:hover { filter: brightness(0.95); }
        .btn-like.active { background-color: #fecdd3; border-color: #f43f5e; color: #e11d48; }
        .btn-share:hover { background-color: var(--accent-color); color: white; border-color: var(--accent-color); }
        .description { font-size: 1rem; line-height: 1.8; opacity: 0.9; margin-bottom: 2rem; flex-grow: 1; }
        
        .author-menu { display: none; margin-top: auto; padding-top: 1rem; border-top: 1px dashed var(--border-color); }
        .btn-add-episode { background-color: var(--accent-color); color: white; padding: 0.8rem 1.5rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .episode-section-title { font-size: 1.3rem; margin-bottom: 1rem; font-weight: bold; }
        .episode-list { background-color: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
        .episode-item { display: flex; align-items: center; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .episode-item:hover { background-color: rgba(99, 102, 241, 0.05); }
        .ep-number { font-size: 1.2rem; font-weight: bold; width: 60px; color: var(--accent-color); }
        .ep-title { flex-grow: 1; font-size: 1.1rem; font-weight: 500; }
        .ep-views { font-size: 0.85rem; opacity: 0.6; margin-right: 15px; }
        .ep-date { font-size: 0.9rem; opacity: 0.6; }
        .empty-episodes { padding: 3rem; text-align: center; opacity: 0.7; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">노넴툰</a>
        <a href="index.html" style="font-weight: 600;">⬅️ 목록으로</a>
    </header>

    <main class="detail-container">
        <section class="webtoon-header" id="webtoonHeader">
            <div style="text-align: center; width: 100%; padding: 3rem; opacity: 0.7;">작품 정보를 불러오는 중입니다... 🔄</div>
        </section>
        <h3 class="episode-section-title">회차 목록</h3>
        <div class="episode-list" id="episodeList">
            <div class="empty-episodes">회차 정보를 불러오는 중입니다... 🔄</div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc, collection, query, where, getDocs, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHc5CKcwIRK_WFmb01PtU9C6l-hYfpymc", authDomain: "nonametoon-907aa.firebaseapp.com",
            projectId: "nonametoon-907aa", storageBucket: "nonametoon-907aa.firebasestorage.app",
            messagingSenderId: "581148914100", appId: "1:581148914100:web:03e65a96e29086eff682e1", measurementId: "G-Q5P01H9MKZ"
        };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
        
        const urlParams = new URLSearchParams(window.location.search);
        const webtoonId = urlParams.get('id');

        const webtoonHeader = document.getElementById('webtoonHeader');
        const episodeList = document.getElementById('episodeList');
        
        let currentUser = null;
        let isLiked = false;
        let isAdmin = false;

        async function initPage() {
            if (!webtoonId) { alert("잘못된 접근입니다."); window.location.href = "index.html"; return; }

            try {
                const webtoonRef = doc(db, "webtoons", webtoonId);
                const webtoonSnap = await getDoc(webtoonRef);

                if (!webtoonSnap.exists()) {
                    webtoonHeader.innerHTML = '<div style="width: 100%; text-align: center;">삭제되었거나 존재하지 않는 작품입니다.</div>'; return;
                }

                const wtData = webtoonSnap.data();
                const descriptionStr = (typeof wtData.description === 'string') ? wtData.description.replace(/\n/g, '<br>') : (wtData.description ? String(wtData.description) : "설명이 없습니다.");
                const thumbUrl = wtData.thumbnail_url || 'https://via.placeholder.com/300x400/cccccc/ffffff?text=No+Image';
                const totalViews = wtData.total_views || 0;
                let totalLikes = wtData.like_count || 0;

                // 상태에 따른 클래스 부여
                const status = wtData.status || "연재중";
                let statusClass = "status-ongoing";
                if (status === "휴재중") statusClass = "status-hiatus";
                else if (status === "시즌완결") statusClass = "status-season-end";
                else if (status === "완결") statusClass = "status-completed";

                webtoonHeader.innerHTML = `
                    <img src="${thumbUrl}" alt="썸네일" class="thumbnail" onerror="this.src='https://via.placeholder.com/300x400/cccccc/ffffff?text=No+Image'">
                    <div class="info-box">
                        <div class="badges">
                            <span class="genre-badge">${wtData.genre || '장르 없음'}</span>
                            <span class="status-badge ${statusClass}">${status}</span>
                        </div>
                        <h1 class="title">${wtData.title || '제목 없음'}</h1>
                        <div class="author">글/그림 : ${wtData.author_nickname || '무명작가'}</div>
                        
                        <div class="stats-box">
                            <span>👁️ 조회수: ${totalViews}</span>
                            <button id="likeBtn" class="action-btn btn-like">🤍 좋아요 <span id="likeDisplayCount">${totalLikes}</span></button>
                            <button id="shareBtn" class="action-btn btn-share">🔗 공유하기</button>
                        </div>

                        <div class="description">${descriptionStr}</div>
                        
                        <div class="author-menu" id="authorMenu" style="gap: 10px;">
                            <button class="btn-add-episode" id="addEpisodeBtn">+ 새 회차 올리기</button>
                            <button class="btn-add-episode" id="editWebtoonBtn" style="background-color: var(--border-color); color: var(--text-color);">✏️ 작품 수정</button>
                        </div>
                    </div>
                `;

                const likeBtn = document.getElementById('likeBtn');
                const shareBtn = document.getElementById('shareBtn');

                shareBtn.onclick = async () => {
                    const currentUrl = window.location.href;
                    try {
                        await navigator.clipboard.writeText(currentUrl);
                        alert("작품 링크가 복사되었습니다!\n원하는 곳에 붙여넣기(Ctrl+V) 하여 공유해보세요.");
                    } catch (err) { alert("링크 복사에 실패했습니다. 주소창의 URL을 직접 복사해주세요."); }
                };

                const epQuery = query(collection(db, "episodes"), where("webtoon_id", "==", webtoonId));
                const epSnap = await getDocs(epQuery);
                episodeList.innerHTML = '';

                if (epSnap.empty) {
                    episodeList.innerHTML = '<div class="empty-episodes">아직 등록된 회차가 없습니다.</div>';
                } else {
                    let epArray = [];
                    epSnap.forEach((docSnap) => { epArray.push({ id: docSnap.id, ...docSnap.data() }); });
                    epArray.sort((a, b) => (b.episode_number || 0) - (a.episode_number || 0));

                    epArray.forEach((ep) => {
                        let dateStr = '날짜 없음';
                        if (ep.created_at && ep.created_at.toDate) {
                            const d = ep.created_at.toDate();
                            dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
                        }
                        const epItem = document.createElement('div');
                        epItem.className = 'episode-item';
                        epItem.innerHTML = `
                            <div class="ep-number">${ep.episode_number || 0}화</div>
                            <div class="ep-title">${ep.title || '제목 없음'}</div>
                            <div class="ep-views">👁️ ${ep.views || 0}</div>
                            <div class="ep-date">${dateStr}</div>
                        `;
                        epItem.onclick = () => { window.location.href = `viewer.html?epId=${ep.id}`; };
                        episodeList.appendChild(epItem);
                    });
                }

                onAuthStateChanged(auth, async (user) => {
                    currentUser = user;
                    
                    if (user) {
                        const userDoc = await getDoc(doc(db, "users", user.uid));
                        if (userDoc.exists() && userDoc.data().role === "admin") {
                            isAdmin = true;
                        }

                        if (user.uid === wtData.author_id || isAdmin) {
                            document.getElementById('authorMenu').style.display = 'flex';
                            document.getElementById('addEpisodeBtn').onclick = () => { window.location.href = `upload_episode.html?webtoonId=${webtoonId}`; };
                            document.getElementById('editWebtoonBtn').onclick = () => { window.location.href = `edit_webtoon.html?id=${webtoonId}`; };
                            
                            if (isAdmin && user.uid !== wtData.author_id) {
                                document.getElementById('editWebtoonBtn').innerText = "👑 (운영자) 작품 수정/삭제";
                            }
                        } else {
                            document.getElementById('authorMenu').style.display = 'none';
                        }

                        const likeRef = doc(db, "likes", `${webtoonId}_${user.uid}`);
                        const likeDoc = await getDoc(likeRef);
                        
                        if (likeDoc.exists()) {
                            isLiked = true;
                            likeBtn.classList.add('active');
                            likeBtn.innerHTML = `❤️ 좋아요 <span id="likeDisplayCount">${totalLikes}</span>`;
                        }

                        likeBtn.onclick = async () => {
                            likeBtn.disabled = true; 
                            try {
                                if (isLiked) {
                                    await deleteDoc(likeRef);
                                    await updateDoc(webtoonRef, { like_count: increment(-1) });
                                    totalLikes--;
                                    isLiked = false;
                                    likeBtn.classList.remove('active');
                                    likeBtn.innerHTML = `🤍 좋아요 <span id="likeDisplayCount">${totalLikes}</span>`;
                                } else {
                                    await setDoc(likeRef, { webtoon_id: webtoonId, user_id: user.uid });
                                    await updateDoc(webtoonRef, { like_count: increment(1) });
                                    totalLikes++;
                                    isLiked = true;
                                    likeBtn.classList.add('active');
                                    likeBtn.innerHTML = `❤️ 좋아요 <span id="likeDisplayCount">${totalLikes}</span>`;
                                }
                            } catch (e) { alert("오류가 발생했습니다."); }
                            likeBtn.disabled = false;
                        };

                    } else {
                        document.getElementById('authorMenu').style.display = 'none';
                        likeBtn.onclick = () => { alert("로그인 후 이용할 수 있습니다."); };
                    }
                });

            } catch (error) {
                console.error("데이터 로드 에러:", error);
                webtoonHeader.innerHTML = '<div style="width: 100%; text-align: center;">데이터를 불러오는 중 오류가 발생했습니다.</div>';
            }
        }
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        initPage();
    </script>
</body>
</html>

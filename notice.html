<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공지사항 - 노넴툰</title>
    <style>
        :root { --bg-color: #f8f9fa; --text-color: #212529; --header-bg: #ffffff; --card-bg: #ffffff; --border-color: #dee2e6; --accent-color: #6366f1; }
        [data-theme="dark"] { --bg-color: #121212; --text-color: #e0e0e0; --header-bg: #1e1e1e; --card-bg: #2d2d2d; --border-color: #404040; --accent-color: #818cf8; }
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        header { background-color: var(--header-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent-color); }
        .notice-container { max-width: 800px; margin: 3rem auto; padding: 0 2rem; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 2.5rem; }
        .notice-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
        .notice-date { font-size: 0.9rem; opacity: 0.6; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        .notice-content { font-size: 1.05rem; line-height: 1.8; min-height: 200px; }
        .back-link { display: inline-block; margin-top: 2rem; font-weight: bold; color: var(--accent-color); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">노넴툰</a>
        <a href="index.html" style="font-weight: 600;">⬅️ 메인으로</a>
    </header>

    <main class="notice-container" id="noticeContainer">
        <h1 class="notice-title" id="noticeTitle">공지사항을 불러오는 중입니다...</h1>
        <div class="notice-date" id="noticeDate">-</div>
        <div class="notice-content" id="noticeContent">잠시만 기다려주세요. 🔄</div>
        <a href="index.html" class="back-link">⬅️ 목록으로 돌아가기</a>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHc5CKcwIRK_WFmb01PtU9C6l-hYfpymc", authDomain: "nonametoon-907aa.firebaseapp.com",
            projectId: "nonametoon-907aa", storageBucket: "nonametoon-907aa.firebasestorage.app",
            messagingSenderId: "581148914100", appId: "1:581148914100:web:03e65a96e29086eff682e1", measurementId: "G-Q5P01H9MKZ"
        };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const noticeId = urlParams.get('id');

        async function loadNoticeDetail() {
            if (!noticeId) {
                document.getElementById('noticeTitle').innerText = "잘못된 접근입니다.";
                return;
            }

            if (noticeId === 'welcome') {
                document.getElementById('noticeTitle').innerText = "[안내] 노넴툰 서비스에 오신 것을 환영합니다! 🎉";
                document.getElementById('noticeDate').innerText = "2026.03.15";
                document.getElementById('noticeContent').innerHTML = `
                    안녕하세요, 노넴툰(No Name Toon) 팀입니다!<br><br>
                    누구나 자유롭게 웹툰 작가가 되어 자신의 작품을 연재하고, 독자들과 소통할 수 있는 무명 작가들의 놀이터 '노넴툰'이 정식 오픈되었습니다.<br><br>
                    - 내 작품 올리기 기능을 통해 자유롭게 웹툰을 등록해 보세요.<br>
                    - 회차별 이미지 등록 및 뷰어, 실시간 댓글과 좋아요, 최근 본 작품 기록까지 모두 지원됩니다.<br><br>
                    앞으로도 많은 이용 부탁드립니다. 감사합니다!
                `;
                return;
            }

            try {
                const docSnap = await getDoc(doc(db, "notices", noticeId));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('noticeTitle').innerText = data.title;
                    
                    let dateStr = '';
                    if (data.created_at && data.created_at.toDate) {
                        const d = data.created_at.toDate();
                        dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
                    }
                    document.getElementById('noticeDate').innerText = dateStr;
                    document.getElementById('noticeContent').innerHTML = data.content ? data.content.replace(/\n/g, '<br>') : "내용이 없습니다.";
                } else {
                    document.getElementById('noticeTitle').innerText = "존재하지 않는 공지사항입니다.";
                    document.getElementById('noticeContent').innerText = "";
                }
            } catch (e) {
                console.error(e);
                document.getElementById('noticeTitle').innerText = "공지사항을 불러오는 중 오류가 발생했습니다.";
            }
        }

        loadNoticeDetail();
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>

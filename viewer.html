<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹툰 감상 - 노넴툰</title>
    <style>
        :root { --bg-color: #f8f9fa; --text-color: #212529; --header-bg: #ffffff; --card-bg: #ffffff; --border-color: #dee2e6; --accent-color: #6366f1; --accent-hover: #4f46e5; --input-bg: #ffffff; }
        [data-theme="dark"] { --bg-color: #121212; --text-color: #e0e0e0; --header-bg: #1e1e1e; --card-bg: #2d2d2d; --border-color: #404040; --accent-color: #818cf8; --accent-hover: #6366f1; --input-bg: #1e1e1e; }
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-color); }
        a { text-decoration: none; color: inherit; }
        
        header { background-color: var(--header-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .back-btn { font-size: 1.2rem; font-weight: bold; cursor: pointer; color: var(--text-color); }
        .ep-info { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; }
        .theme-toggle-btn { background: none; border: 2px solid var(--border-color); color: var(--text-color); padding: 0.4rem 0.8rem; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        
        .viewer-container { max-width: 800px; margin: 0 auto; background-color: #fff; min-height: 80vh; display: flex; flex-direction: column; align-items: center; }
        [data-theme="dark"] .viewer-container { background-color: #000; }
        .viewer-img { width: 100%; display: block; border: none; }
        .loading-message { padding: 5rem; text-align: center; font-size: 1.2rem; opacity: 0.7; }
        
        .comment-section { max-width: 800px; margin: 0 auto; padding: 2rem; background-color: var(--card-bg); border-top: 1px solid var(--border-color); }
        .comment-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 1rem; }
        .comment-form { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; background-color: var(--bg-color); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); }
        .comment-form textarea { width: 100%; height: 80px; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--input-bg); color: var(--text-color); font-family: inherit; resize: none; font-size: 0.95rem; }
        .comment-form textarea:focus { outline: none; border-color: var(--accent-color); }
        .comment-submit-btn { align-self: flex-end; background-color: var(--accent-color); color: white; border: none; padding: 0.6rem 1.5rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .comment-submit-btn:hover { background-color: var(--accent-hover); }
        .comment-submit-btn:disabled { background-color: var(--border-color); cursor: not-allowed; }
        
        .comment-list { display: flex; flex-direction: column; gap: 1rem; }
        .comment-item { padding: 1rem; border-bottom: 1px solid var(--border-color); }
        .comment-item:last-child { border-bottom: none; }
        .comment-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .comment-author { font-weight: bold; color: var(--accent-color); margin-right: 10px; }
        .comment-date { opacity: 0.6; }
        .comment-body { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
        .empty-comment { text-align: center; padding: 2rem; opacity: 0.6; }
        
        .comment-actions { display: flex; gap: 0.5rem; }
        .action-btn { background: none; border: none; font-size: 0.8rem; color: var(--text-color); opacity: 0.6; cursor: pointer; padding: 0.2rem; }
        .action-btn:hover { opacity: 1; color: var(--accent-color); }
        .edit-textarea { width: 100%; height: 60px; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); resize: vertical; margin-bottom: 5px; font-family: inherit;}
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="javascript:history.back()" class="back-btn" id="backBtn">⬅️</a>
            <div class="ep-info" id="epTitleDisplay">로딩 중...</div>
        </div>
        <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()">🌙 다크 모드</button>
    </header>

    <main class="viewer-container" id="viewerContainer">
        <div class="loading-message">웹툰 이미지를 불러오는 중입니다... 🔄</div>
    </main>

    <section class="comment-section">
        <div class="comment-title">💬 댓글 (<span id="commentCount">0</span>)</div>
        <form class="comment-form" id="commentForm">
            <textarea id="commentInput" placeholder="바른 말 고운 말을 사용해주세요. (로그인 후 작성 가능)" required></textarea>
            <button type="submit" class="comment-submit-btn" id="commentBtn">댓글 등록</button>
        </form>
        <div class="comment-list" id="commentList">
            <div class="empty-comment">댓글을 불러오는 중입니다...</div>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, updateDoc, deleteDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHc5CKcwIRK_WFmb01PtU9C6l-hYfpymc", authDomain: "nonametoon-907aa.firebaseapp.com",
            projectId: "nonametoon-907aa", storageBucket: "nonametoon-907aa.firebasestorage.app",
            messagingSenderId: "581148914100", appId: "1:581148914100:web:03e65a96e29086eff682e1", measurementId: "G-Q5P01H9MKZ"
        };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const epId = urlParams.get('epId');

        const viewerContainer = document.getElementById('viewerContainer');
        const epTitleDisplay = document.getElementById('epTitleDisplay');
        const backBtn = document.getElementById('backBtn');
        
        const commentForm = document.getElementById('commentForm');
        const commentInput = document.getElementById('commentInput');
        const commentBtn = document.getElementById('commentBtn');
        const commentList = document.getElementById('commentList');
        const commentCountDisplay = document.getElementById('commentCount');

        let currentUser = null;
        let isViewerLoaded = false;

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (!user) {
                commentInput.placeholder = "로그인 후 댓글을 작성할 수 있습니다.";
                commentInput.disabled = true; commentBtn.disabled = true;
            } else {
                commentInput.placeholder = "바른 말 고운 말을 사용해주세요.";
                commentInput.disabled = false; commentBtn.disabled = false;
            }
            
            // 로그인 정보를 확인한 직후에 뷰어를 로드하여 권한 버튼이 정확히 뜨도록 개선
            if (!isViewerLoaded) {
                isViewerLoaded = true;
                loadViewer();
            }
        });

        async function loadViewer() {
            if (!epId) { alert("잘못된 접근입니다."); window.location.href = "index.html"; return; }
            try {
                const epRef = doc(db, "episodes", epId);
                const epSnap = await getDoc(epRef);
                if (!epSnap.exists()) {
                    viewerContainer.innerHTML = '<div class="loading-message">삭제되었거나 존재하지 않는 회차입니다.</div>';
                    epTitleDisplay.innerText = "오류"; return;
                }
                const epData = epSnap.data();
                epTitleDisplay.innerText = `${epData.episode_number}화 - ${epData.title}`;
                backBtn.href = `detail.html?id=${epData.webtoon_id}`;
                
                // ===== 작가일 경우 에피소드 수정 버튼 띄우기 =====
                const webtoonSnap = await getDoc(doc(db, "webtoons", epData.webtoon_id));
                if (webtoonSnap.exists()) {
                    const wtData = webtoonSnap.data();
                    if (currentUser && currentUser.uid === wtData.author_id) {
                        const editEpBtn = document.createElement('a');
                        editEpBtn.href = `edit_episode.html?epId=${epId}`;
                        editEpBtn.innerText = "✏️ 회차 수정";
                        editEpBtn.style.cssText = "font-size: 0.8rem; margin-left: 10px; background: var(--border-color); padding: 4px 8px; border-radius: 4px; color: var(--text-color);";
                        epTitleDisplay.appendChild(editEpBtn);
                    }
                }
                // ============================================

                viewerContainer.innerHTML = '';

                if (epData.content_images && epData.content_images.length > 0) {
                    epData.content_images.forEach((url) => {
                        const imgEl = document.createElement('img');
                        imgEl.src = url; imgEl.className = 'viewer-img'; imgEl.alt = "웹툰 컷";
                        imgEl.onerror = () => { imgEl.src = 'https://via.placeholder.com/800x600/cccccc/ffffff?text=Image+Load+Error'; };
                        viewerContainer.appendChild(imgEl);
                    });
                } else { viewerContainer.innerHTML = '<div class="loading-message">등록된 이미지가 없습니다.</div>'; }
                
                loadComments();
            } catch (error) {
                console.error("웹툰 로딩 오류:", error);
                viewerContainer.innerHTML = '<div class="loading-message">이미지를 불러오는 중 오류가 발생했습니다.</div>';
            }
        }

        function loadComments() {
            const q = query(collection(db, "comments"), where("episode_id", "==", epId));
            
            onSnapshot(q, (snapshot) => {
                commentList.innerHTML = '';
                commentCountDisplay.innerText = snapshot.size;

                if (snapshot.empty) {
                    commentList.innerHTML = '<div class="empty-comment">첫 번째 댓글을 남겨보세요!</div>';
                    return;
                }

                let commentsArray = [];
                snapshot.forEach((docSnap) => {
                    commentsArray.push({ id: docSnap.id, ...docSnap.data() });
                });

                // 최신순 정렬
                commentsArray.sort((a, b) => {
                    const timeA = a.created_at ? (a.created_at.toDate ? a.created_at.toDate().getTime() : new Date(a.created_at).getTime()) : 0;
                    const timeB = b.created_at ? (b.created_at.toDate ? b.created_at.toDate().getTime() : new Date(b.created_at).getTime()) : 0;
                    return timeB - timeA;
                });

                commentsArray.forEach((data) => {
                    let dateStr = '방금 전';
                    if (data.created_at && data.created_at.toDate) {
                        const d = data.created_at.toDate();
                        dateStr = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                    }

                    const isMyComment = currentUser && currentUser.uid === data.user_id;

                    const commentItem = document.createElement('div');
                    commentItem.className = 'comment-item';
                    
                    const actionHtml = isMyComment ? `
                        <div class="comment-actions">
                            <button class="action-btn edit-btn">수정</button>
                            <button class="action-btn delete-btn">삭제</button>
                        </div>
                    ` : '';

                    commentItem.innerHTML = `
                        <div class="comment-header">
                            <div>
                                <span class="comment-author">${data.nickname}</span>
                                <span class="comment-date">${dateStr}</span>
                            </div>
                            ${actionHtml}
                        </div>
                        <div class="comment-body" id="body-${data.id}">${data.content}</div>
                    `;
                    
                    if (isMyComment) {
                        const editBtn = commentItem.querySelector('.edit-btn');
                        const deleteBtn = commentItem.querySelector('.delete-btn');
                        const bodyDiv = commentItem.querySelector('.comment-body');
                        
                        deleteBtn.addEventListener('click', async () => {
                            if(confirm("이 댓글을 정말 삭제하시겠습니까?")) {
                                try { await deleteDoc(doc(db, "comments", data.id)); } catch (e) { alert("삭제에 실패했습니다."); }
                            }
                        });

                        editBtn.addEventListener('click', () => {
                            const currentText = data.content;
                            bodyDiv.innerHTML = `
                                <textarea class="edit-textarea">${currentText}</textarea>
                                <div style="text-align:right;">
                                    <button class="action-btn save-btn" style="color:var(--accent-color); font-weight:bold;">저장</button>
                                    <button class="action-btn cancel-btn">취소</button>
                                </div>
                            `;
                            
                            const saveBtn = bodyDiv.querySelector('.save-btn');
                            const cancelBtn = bodyDiv.querySelector('.cancel-btn');
                            const textarea = bodyDiv.querySelector('.edit-textarea');

                            saveBtn.addEventListener('click', async () => {
                                const newText = textarea.value.trim();
                                if(!newText) { alert("내용을 입력해주세요."); return; }
                                try { await updateDoc(doc(db, "comments", data.id), { content: newText }); } 
                                catch(e) { alert("수정에 실패했습니다."); }
                            });

                            cancelBtn.addEventListener('click', () => { bodyDiv.innerText = currentText; });
                        });
                    }
                    
                    commentList.appendChild(commentItem);
                });
            });
        }

        commentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser || !epId) return;

            const content = commentInput.value.trim();
            if (!content) return;

            commentBtn.disabled = true; commentBtn.innerText = "등록 중...";
            try {
                await addDoc(collection(db, "comments"), {
                    episode_id: epId, user_id: currentUser.uid, nickname: currentUser.displayName || "무명독자",
                    content: content, created_at: serverTimestamp()
                });
                commentInput.value = '';
            } catch (error) { console.error("댓글 등록 오류:", error); alert("댓글을 등록하지 못했습니다."); } 
            finally { commentBtn.disabled = false; commentBtn.innerText = "댓글 등록"; }
        });

    </script>
    <script>
        const htmlEl = document.documentElement; const themeBtn = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light'; htmlEl.setAttribute('data-theme', savedTheme);
        themeBtn.innerText = savedTheme === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';
        function toggleTheme() {
            const next = htmlEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            htmlEl.setAttribute('data-theme', next); localStorage.setItem('theme', next);
            themeBtn.innerText = next === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';
        }
    </script>
</body>
</html>

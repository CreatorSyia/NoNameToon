<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹툰 감상 - 노넴툰</title>
    <style>
        /* 기본 테마 변수 */
        :root {
            --bg-color: #f8f9fa; --text-color: #212529; --header-bg: #ffffff; 
            --border-color: #dee2e6; --accent-color: #6366f1;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --text-color: #e0e0e0; --header-bg: #1e1e1e; 
            --border-color: #404040; --accent-color: #818cf8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-color); }
        a { text-decoration: none; color: inherit; }

        /* 뷰어 전용 헤더 (화면 스크롤 시에도 위에 고정됨) */
        header { 
            background-color: var(--header-bg); border-bottom: 1px solid var(--border-color); 
            padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .back-btn { font-size: 1.2rem; font-weight: bold; cursor: pointer; color: var(--text-color); }
        .ep-info { font-weight: 700; font-size: 1.1rem; }
        
        .theme-toggle-btn { background: none; border: 2px solid var(--border-color); color: var(--text-color); padding: 0.4rem 0.8rem; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .theme-toggle-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }

        /* 이미지들이 들어갈 중앙 정렬 컨테이너 */
        .viewer-container {
            max-width: 800px; /* 웹툰 최대 너비 */
            margin: 0 auto;
            background-color: #fff; /* 이미지가 없는 배경은 흰색 고정 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        [data-theme="dark"] .viewer-container {
            background-color: #000; /* 다크모드 시 웹툰 배경 검은색 */
        }

        /* 핵심! 이미지 사이의 틈을 없애고 꽉 차게 만듭니다 */
        .viewer-img {
            width: 100%;
            display: block; /* 이미지 아래쪽 여백 제거 */
            border: none;
        }

        .loading-message { padding: 5rem; text-align: center; font-size: 1.2rem; opacity: 0.7; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="javascript:history.back()" class="back-btn" id="backBtn">⬅️</a>
            <div class="ep-info" id="epTitleDisplay">로딩 중...</div>
        </div>
        <button class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()">🌙 다크 모드</button>
    </header>

    <main class="viewer-container" id="viewerContainer">
        <div class="loading-message">웹툰 이미지를 불러오는 중입니다... 🔄</div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHc5CKcwIRK_WFmb01PtU9C6l-hYfpymc",
            authDomain: "nonametoon-907aa.firebaseapp.com",
            projectId: "nonametoon-907aa",
            storageBucket: "nonametoon-907aa.firebasestorage.app",
            messagingSenderId: "581148914100",
            appId: "1:581148914100:web:03e65a96e29086eff682e1",
            measurementId: "G-Q5P01H9MKZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // URL에서 회차 ID(epId) 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const epId = urlParams.get('epId');

        const viewerContainer = document.getElementById('viewerContainer');
        const epTitleDisplay = document.getElementById('epTitleDisplay');
        const backBtn = document.getElementById('backBtn');

        async function loadViewer() {
            if (!epId) {
                alert("잘못된 접근입니다.");
                window.location.href = "index.html";
                return;
            }

            try {
                // 데이터베이스에서 해당 회차 데이터 1개 쏙 뽑아오기
                const epRef = doc(db, "episodes", epId);
                const epSnap = await getDoc(epRef);

                if (!epSnap.exists()) {
                    viewerContainer.innerHTML = '<div class="loading-message">삭제되었거나 존재하지 않는 회차입니다.</div>';
                    epTitleDisplay.innerText = "오류";
                    return;
                }

                const epData = epSnap.data();
                
                // 상단 헤더에 제목 표시
                epTitleDisplay.innerText = `${epData.episode_number}화 - ${epData.title}`;

                // 뒤로가기 버튼을 해당 웹툰의 상세 페이지로 연결
                backBtn.href = `detail.html?id=${epData.webtoon_id}`;

                viewerContainer.innerHTML = ''; // 로딩 메시지 지우기

                // 이미지 URL 배열을 돌면서 img 태그 만들어서 붙이기
                if (epData.content_images && epData.content_images.length > 0) {
                    epData.content_images.forEach((url) => {
                        const imgEl = document.createElement('img');
                        imgEl.src = url;
                        imgEl.className = 'viewer-img';
                        imgEl.alt = "웹툰 컷";
                        // 이미지가 깨질 경우 안내 이미지 표시
                        imgEl.onerror = () => { imgEl.src = 'https://via.placeholder.com/800x600/cccccc/ffffff?text=Image+Load+Error'; };
                        
                        viewerContainer.appendChild(imgEl);
                    });
                } else {
                    viewerContainer.innerHTML = '<div class="loading-message">등록된 이미지가 없습니다.</div>';
                }

            } catch (error) {
                console.error("웹툰 로딩 오류:", error);
                viewerContainer.innerHTML = '<div class="loading-message">이미지를 불러오는 중 오류가 발생했습니다.</div>';
            }
        }

        loadViewer();
    </script>
    
    <!-- 뷰어 테마 토글 로직 -->
    <script>
        const htmlEl = document.documentElement;
        const themeBtn = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        htmlEl.setAttribute('data-theme', savedTheme);
        themeBtn.innerText = savedTheme === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';
        function toggleTheme() {
            const next = htmlEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            htmlEl.setAttribute('data-theme', next); localStorage.setItem('theme', next);
            themeBtn.innerText = next === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';
        }
    </script>
</body>
</html>

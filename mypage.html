<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 노넴툰</title>
    <style>
        /* 기본 테마 변수 */
        :root {
            --bg-color: #f8f9fa; --text-color: #212529; --header-bg: #ffffff; --card-bg: #ffffff;
            --border-color: #dee2e6; --accent-color: #6366f1; --accent-hover: #4f46e5; --input-bg: #ffffff;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --text-color: #e0e0e0; --header-bg: #1e1e1e; --card-bg: #2d2d2d;
            --border-color: #404040; --accent-color: #818cf8; --accent-hover: #6366f1; --input-bg: #1e1e1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        a { text-decoration: none; color: inherit; }

        /* 헤더 */
        header { background-color: var(--header-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent-color); }
        .nav-links a:hover { color: var(--accent-color); }

        /* 메인 레이아웃 */
        .mypage-container { max-width: 1000px; margin: 3rem auto; padding: 0 2rem; }
        
        /* 프로필 섹션 */
        .profile-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 2rem; margin-bottom: 3rem; display: flex; align-items: center; gap: 2rem; position: relative;
        }
        /* 프로필 아바타 이미지 스타일 추가 */
        .profile-avatar { width: 80px; height: 80px; background-color: var(--accent-color); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; overflow: hidden; }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info h2 { font-size: 1.5rem; margin-bottom: 0.2rem; }
        .profile-info p { opacity: 0.7; margin-bottom: 0.8rem; }
        
        /* 닉네임/프로필 변경 버튼 */
        .btn-edit-profile { background-color: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; transition: background 0.2s; }
        .btn-edit-profile:hover { background-color: var(--border-color); }

        /* 모달 스타일 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
        [data-theme="dark"] .modal-overlay { background-color: rgba(0,0,0,0.7); }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background-color: var(--card-bg); padding: 2.5rem; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; transform: translateY(-20px); transition: transform 0.3s ease-out; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; background: none; border: none; color: var(--text-color); cursor: pointer; }
        .modal-content h2 { margin-bottom: 1.5rem; text-align: center; color: var(--accent-color); }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: bold; }
        .input-group input { width: 100%; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--input-bg); color: var(--text-color); }
        .btn-submit { width: 100%; padding: 0.8rem; background-color: var(--accent-color); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 1rem; }
        .btn-submit:disabled { background-color: var(--border-color); cursor: not-allowed; }
        .help-text { font-size: 0.8rem; opacity: 0.8; color: #ef4444; margin-top: 0.5rem; line-height: 1.4; }
        .help-text.gray { color: var(--text-color); opacity: 0.6; }

        /* 작품 목록 섹션 */
        .section-title { font-size: 1.5rem; margin-bottom: 1.5rem; font-weight: 700; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; margin-top: 3rem; }
        .webtoon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; }
        
        .webtoon-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
        .webtoon-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); border-color: var(--accent-color); }
        .webtoon-thumbnail { width: 100%; height: 260px; background-color: #ddd; object-fit: cover; }
        .webtoon-info { padding: 1.2rem; background-color: var(--card-bg); flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        
        .badges { display: flex; gap: 0.4rem; margin-bottom: 0.5rem; flex-wrap: wrap; }
        .genre-badge { padding: 0.2rem 0.6rem; background-color: var(--accent-color); color: white; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .status-badge { padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: white; }
        .status-ongoing { background-color: #ef4444; } 
        .status-hiatus { background-color: #6b7280; } 
        .status-season-end { background-color: #3b82f6; } 
        .status-completed { background-color: #ffffff; color: #1f2937; border: 1px solid #d1d5db; } 
        [data-theme="dark"] .status-completed { background-color: #1f2937; color: #f3f4f6; border: 1px solid #4b5563; }

        .webtoon-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 0.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .webtoon-author { font-size: 0.9rem; opacity: 0.7; }

        .empty-message { padding: 3rem; text-align: center; opacity: 0.7; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">노넴툰</a>
        <div class="nav-links">
            <a href="index.html" style="font-weight: 600;">⬅️ 메인으로 돌아가기</a>
        </div>
    </header>

    <main class="mypage-container">
        <!-- 프로필 섹션 -->
        <section class="profile-card">
            <div class="profile-avatar" id="avatarChar">?</div>
            <div class="profile-info">
                <h2 id="profileName">로딩 중...</h2>
                <p id="profileEmail">이메일 정보를 불러오는 중입니다.</p>
                <button class="btn-edit-profile" id="openProfileModalBtn">✏️ 프로필 수정</button>
            </div>
        </section>

        <!-- 감상 기록 섹션 -->
        <h2 class="section-title">🕒 최근 본 작품</h2>
        <div class="webtoon-grid" id="historyWebtoonGrid">
            <div class="empty-message">감상 기록을 불러오는 중입니다... 🔄</div>
        </div>

        <!-- 관심 작품(좋아요) 섹션 -->
        <h2 class="section-title">❤️ 관심 작품</h2>
        <div class="webtoon-grid" id="likedWebtoonGrid">
            <div class="empty-message">좋아요한 작품을 불러오는 중입니다... 🔄</div>
        </div>

        <!-- 내가 올린 작품 섹션 -->
        <h2 class="section-title">📚 내가 연재 중인 작품</h2>
        <div class="webtoon-grid" id="myWebtoonGrid">
            <div class="empty-message">작품을 불러오는 중입니다... 🔄</div>
        </div>
    </main>

    <!-- 프로필 변경 모달 (닉네임 + 이미지 URL) -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-content">
            <button class="close-btn" id="closeProfileModalBtn">&times;</button>
            <h2>프로필 수정</h2>
            
            <!-- 프로필 이미지 변경 -->
            <div class="input-group">
                <label for="newPhotoUrlInput">프로필 이미지 URL</label>
                <input type="url" id="newPhotoUrlInput" placeholder="이미지 주소(URL)를 입력하세요">
                <p class="help-text gray">※ 공란으로 두시면 기본 이미지가 적용됩니다.</p>
            </div>

            <!-- 닉네임 변경 -->
            <div class="input-group">
                <label for="newNicknameInput">새로운 닉네임</label>
                <input type="text" id="newNicknameInput" placeholder="새 닉네임을 입력하세요" maxlength="15">
                <p class="help-text">※ 닉네임은 한 번 변경하면 <strong>7일 동안</strong> 다시 변경할 수 없습니다.</p>
            </div>
            
            <button class="btn-submit" id="saveProfileBtn">변경하기</button>
        </div>
    </div>

    <!-- Firebase 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBHc5CKcwIRK_WFmb01PtU9C6l-hYfpymc", authDomain: "nonametoon-907aa.firebaseapp.com",
            projectId: "nonametoon-907aa", storageBucket: "nonametoon-907aa.firebasestorage.app",
            messagingSenderId: "581148914100", appId: "1:581148914100:web:03e65a96e29086eff682e1", measurementId: "G-Q5P01H9MKZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const historyWebtoonGrid = document.getElementById('historyWebtoonGrid');
        const likedWebtoonGrid = document.getElementById('likedWebtoonGrid');
        const myWebtoonGrid = document.getElementById('myWebtoonGrid');
        
        const profileName = document.getElementById('profileName');
        const profileEmail = document.getElementById('profileEmail');
        const avatarChar = document.getElementById('avatarChar');

        // 프로필 모달 요소
        const profileModal = document.getElementById('profileModal');
        const openProfileModalBtn = document.getElementById('openProfileModalBtn');
        const closeProfileModalBtn = document.getElementById('closeProfileModalBtn');
        const saveProfileBtn = document.getElementById('saveProfileBtn');
        const newNicknameInput = document.getElementById('newNicknameInput');
        const newPhotoUrlInput = document.getElementById('newPhotoUrlInput');

        let currentUser = null;
        let lastNicknameChangedAt = null;

        // 웹툰 카드를 만드는 공통 함수
        function createWebtoonCard(wtData, wtId, extraText = "") {
            const card = document.createElement('div');
            card.className = 'webtoon-card';
            
            const thumbUrl = wtData.thumbnail_url || 'https://via.placeholder.com/300x400/cccccc/ffffff?text=No+Image';
            const authorName = wtData.author_nickname || wtData.author || '무명작가';
            const infoText = extraText ? extraText : `작가: ${authorName}`;

            const status = wtData.status || "연재중";
            let statusClass = "status-ongoing";
            if (status === "휴재중") statusClass = "status-hiatus";
            else if (status === "시즌완결") statusClass = "status-season-end";
            else if (status === "완결") statusClass = "status-completed";
            
            const genreBadgeHtml = wtData.genre ? `<span class="genre-badge">${wtData.genre}</span>` : '';

            card.innerHTML = `
                <img src="${thumbUrl}" alt="썸네일" class="webtoon-thumbnail" onerror="this.src='https://via.placeholder.com/300x400/cccccc/ffffff?text=No+Image'">
                <div class="webtoon-info">
                    <div class="badges">
                        ${genreBadgeHtml}
                        <span class="status-badge ${statusClass}">${status}</span>
                    </div>
                    <div class="webtoon-title">${wtData.title || '제목 없음'}</div>
                    <div class="webtoon-author">${infoText}</div>
                </div>
            `;
            card.onclick = () => { window.location.href = `detail.html?id=${wtId}`; };
            return card;
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const nickname = user.displayName || "무명작가";
                const photoUrl = user.photoURL;

                profileName.innerText = `${nickname}님`;
                profileEmail.innerText = user.email;

                // 프로필 이미지가 있으면 이미지 표시, 없으면 첫 글자 표시
                if (photoUrl) {
                    avatarChar.innerHTML = `<img src="${photoUrl}" alt="프로필" onerror="this.src='https://via.placeholder.com/80x80/6366f1/ffffff?text=${nickname.charAt(0)}'">`;
                } else {
                    avatarChar.innerText = nickname.charAt(0);
                }

                // 유저 정보 가져와서 닉네임 쿨타임 데이터 확인
                try {
                    const userDocSnap = await getDoc(doc(db, "users", user.uid));
                    if (userDocSnap.exists() && userDocSnap.data().last_nickname_changed_at) {
                        lastNicknameChangedAt = userDocSnap.data().last_nickname_changed_at;
                    }
                } catch (e) { console.error("유저 정보 로드 실패:", e); }

                // --- 1. 내가 올린 작품 불러오기 ---
                try {
                    const qMy = query(collection(db, "webtoons"), where("author_id", "==", user.uid));
                    const snapMy = await getDocs(qMy);
                    myWebtoonGrid.innerHTML = '';
                    if (snapMy.empty) {
                        myWebtoonGrid.innerHTML = '<div class="empty-message">아직 등록하신 작품이 없습니다.<br><br><a href="upload.html" style="color:var(--accent-color); font-weight:bold;">+ 첫 작품 올리러 가기</a></div>';
                    } else {
                        snapMy.forEach((docSnap) => { myWebtoonGrid.appendChild(createWebtoonCard(docSnap.data(), docSnap.id)); });
                    }
                } catch (e) { console.error(e); }

                // --- 2. 관심 작품(좋아요) 불러오기 ---
                try {
                    const qLike = query(collection(db, "likes"), where("user_id", "==", user.uid));
                    const snapLike = await getDocs(qLike);
                    likedWebtoonGrid.innerHTML = '';
                    if (snapLike.empty) {
                        likedWebtoonGrid.innerHTML = '<div class="empty-message">아직 좋아요를 누른 작품이 없습니다.</div>';
                    } else {
                        snapLike.forEach(async (likeSnap) => {
                            const likeData = likeSnap.data();
                            const wtSnap = await getDoc(doc(db, "webtoons", likeData.webtoon_id));
                            if (wtSnap.exists()) likedWebtoonGrid.appendChild(createWebtoonCard(wtSnap.data(), wtSnap.id));
                        });
                    }
                } catch (e) { console.error(e); }

                // --- 3. 최근 본 작품(감상 기록) 불러오기 ---
                try {
                    const qHist = query(collection(db, "history"), where("user_id", "==", user.uid));
                    const snapHist = await getDocs(qHist);
                    historyWebtoonGrid.innerHTML = '';
                    if (snapHist.empty) {
                        historyWebtoonGrid.innerHTML = '<div class="empty-message">최근 감상한 작품이 없습니다.</div>';
                    } else {
                        let histArray = [];
                        snapHist.forEach(d => histArray.push(d.data()));
                        histArray.sort((a, b) => {
                            const timeA = a.last_viewed_at ? (a.last_viewed_at.toDate ? a.last_viewed_at.toDate().getTime() : new Date(a.last_viewed_at).getTime()) : 0;
                            const timeB = b.last_viewed_at ? (b.last_viewed_at.toDate ? b.last_viewed_at.toDate().getTime() : new Date(b.last_viewed_at).getTime()) : 0;
                            return timeB - timeA;
                        });
                        for (const histData of histArray) {
                            const wtSnap = await getDoc(doc(db, "webtoons", histData.webtoon_id));
                            if (wtSnap.exists()) {
                                const extraText = `<span style="color:var(--accent-color); font-weight:bold;">현재 ${histData.episode_number}화 감상</span>`;
                                historyWebtoonGrid.appendChild(createWebtoonCard(wtSnap.data(), wtSnap.id, extraText));
                            }
                        }
                    }
                } catch (e) { console.error(e); }

            } else {
                alert("로그인이 필요한 페이지입니다.");
                window.location.href = "index.html";
            }
        });

        // 프로필 수정 모달 제어
        openProfileModalBtn.addEventListener('click', () => {
            newNicknameInput.value = currentUser.displayName || "";
            newPhotoUrlInput.value = currentUser.photoURL || "";
            profileModal.classList.add('active');
        });

        closeProfileModalBtn.addEventListener('click', () => {
            profileModal.classList.remove('active');
        });

        profileModal.addEventListener('click', (e) => {
            if (e.target === profileModal) profileModal.classList.remove('active');
        });

        // 프로필 변경 저장 로직
        saveProfileBtn.addEventListener('click', async () => {
            const newName = newNicknameInput.value.trim();
            const newPhotoUrl = newPhotoUrlInput.value.trim();

            if (!newName) {
                alert("닉네임을 입력해주세요."); return;
            }

            const isNicknameChanged = newName !== currentUser.displayName;
            const isPhotoChanged = newPhotoUrl !== (currentUser.photoURL || "");

            if (!isNicknameChanged && !isPhotoChanged) {
                alert("변경된 내용이 없습니다.");
                profileModal.classList.remove('active');
                return;
            }

            // 닉네임이 변경되었을 때만 7일 쿨타임 검사 실행
            if (isNicknameChanged && lastNicknameChangedAt) {
                const lastTime = lastNicknameChangedAt.toDate().getTime();
                const nowTime = new Date().getTime();
                const diffDays = (nowTime - lastTime) / (1000 * 60 * 60 * 24); 
                
                if (diffDays < 7) {
                    const remainDays = Math.ceil(7 - diffDays);
                    alert(`닉네임은 7일에 한 번만 변경할 수 있습니다.\n(남은 대기 시간: 약 ${remainDays}일)\n\n※ 프로필 사진만 변경하려면 닉네임을 원래대로 돌려주세요.`);
                    return;
                }
            }

            saveProfileBtn.disabled = true;
            saveProfileBtn.innerText = "변경 중...";

            try {
                const profileUpdates = {};
                const docUpdates = {};

                if (isNicknameChanged) {
                    profileUpdates.displayName = newName;
                    docUpdates.nickname = newName;
                    docUpdates.last_nickname_changed_at = serverTimestamp();
                }

                if (isPhotoChanged) {
                    profileUpdates.photoURL = newPhotoUrl;
                    docUpdates.photo_url = newPhotoUrl; // DB에도 저장해두기
                }

                // Auth 정보 업데이트
                await updateProfile(currentUser, profileUpdates);
                
                // Firestore 문서 업데이트 (업데이트할 항목이 있을 때만)
                if (Object.keys(docUpdates).length > 0) {
                    await updateDoc(doc(db, "users", currentUser.uid), docUpdates);
                }

                alert("프로필이 성공적으로 변경되었습니다!");
                window.location.reload();

            } catch (error) {
                console.error("프로필 변경 오류:", error);
                alert("프로필 변경에 실패했습니다. 잠시 후 다시 시도해주세요.");
                saveProfileBtn.disabled = false;
                saveProfileBtn.innerText = "변경하기";
            }
        });

        // 테마 유지
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
